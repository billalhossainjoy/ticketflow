name: Detect release changes

on:
  workflow_call:
    outputs:
      release:
        description: Whether changes require publishing and deployment
        value: ${{ jobs.changes.outputs.release }}

permissions:
  contents: read

jobs:
  changes:
    name: Check release changes
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      release: ${{ steps.detect.outputs.release }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changes outside documentation
        id: detect
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only --no-renames -z \
            "$BEFORE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/changed-files"

          release=false
          while IFS= read -r -d '' file; do
            case "$file" in
              docs/*|README.md|CONTRIBUTING.md|CHANGELOG.md)
                ;;
              *)
                release=true
                break
                ;;
            esac
          done < "$RUNNER_TEMP/changed-files"

          echo "release=$release" >> "$GITHUB_OUTPUT"
