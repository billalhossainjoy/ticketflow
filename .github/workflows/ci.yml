name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build API Docker image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ticketflow-api:ci \
            .
  verify-arm64:
    name: Verify ARM64 API image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f apps/api/Dockerfile \
            -t ticketflow-api:arm64-check \
            --load \
            .
      - name: Verify ARM64 API startup
        run: |
          docker run -d \
            --platform linux/arm64 \
            --name api-arm64-check \
            -p 127.0.0.1:3001:3000 \
            ticketflow-api:arm64-check

          curl --fail-with-body \
            --retry 15 \
            --retry-all-errors \
            --retry-connrefused \
            --retry-delay 2 \
            --retry-max-time 60 \
            http://127.0.0.1:3001/health/live

      - name: Show ARM64 container logs
        if: always()
        run: docker logs api-arm64-check

      - name: Remove ARM64 test container
        if: always()
        run: docker rm -f api-arm64-check

  publish:
    name: Publish multi-platform API image
    needs: [verify, verify-arm64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/billalhossainjoy/ticketflow-api

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Build and push release image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f apps/api/Dockerfile \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$IMAGE:$GITHUB_SHA" \
            --push \
            .

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io

  deploy:
    name: Deploy API to home server
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Fetch deployment secrets
        uses: Infisical/secrets-action@v1.0.9
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_IDENTITY_ID }}
          project-id: ${{ vars.INFISICAL_PROJECT_ID }}
          oidc-audience: https://app.infisical.com
          domain: https://app.infisical.com
          env-slug: prod
          secret-path: /
          export-type: env
          include-imports: false
          recursive: false

      - name: Check required deployment values
        shell: bash
        run: |
          for name in TS_CLIENT_ID TS_AUDIENCE DEPLOY_SSH_PRIVATE_KEY DEPLOY_SSH_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is missing"
              exit 1
            fi
          done

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TS_CLIENT_ID }}
          audience: ${{ env.TS_AUDIENCE }}
          tags: tag:ticketflow-ci

      - name: Prepare SSH files
        shell: bash
        run: |
          umask 077
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"

      - name: Verify server connection
        shell: bash
        run: |
          ssh \
            -i "$RUNNER_TEMP/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o ConnectTimeout=15 \
            billal@oparadox \
            'hostname && whoami'

      - name: Copy production Compose configuration
        shell: bash
        run: |
          scp \
            -i "$RUNNER_TEMP/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o ConnectTimeout=15 \
            deploy/compose.production.yml \
            billal@oparadox:~/ticketflow/compose.production.yml

      - name: Deploy API
        shell: bash
        run: |
          ssh \
            -i "$RUNNER_TEMP/deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" \
            -o ConnectTimeout=15 \
            billal@oparadox \
            "bash -s -- '$GITHUB_SHA'" <<'REMOTE'
          set -euo pipefail
          cd "$HOME/ticketflow"

          export TICKETFLOW_API_IMAGE="ghcr.io/billalhossainjoy/ticketflow-api:$1"

          docker compose -f compose.production.yml config --quiet
          docker compose -f compose.production.yml pull api
          docker compose -f compose.production.yml up -d --wait --wait-timeout 120
          docker compose -f compose.production.yml ps
          REMOTE

      - name: Remove SSH files
        if: always()
        shell: bash
        run: |
          rm -f -- "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/known_hosts"
