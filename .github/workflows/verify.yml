name: Verify

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build API Docker image
        run: |
          docker build \
            -f apps/api/Dockerfile \
            -t ticketflow-api:ci \
            .

  verify-arm64:
    name: Verify ARM64 API image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ARM64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            -f apps/api/Dockerfile \
            -t ticketflow-api:arm64-check \
            --load \
            .

      - name: Verify ARM64 API startup
        run: |
          docker run -d \
            --platform linux/arm64 \
            --name api-arm64-check \
            -p 127.0.0.1:3001:3000 \
            ticketflow-api:arm64-check

          curl --fail-with-body \
            --connect-timeout 2 \
            --max-time 5 \
            --retry 15 \
            --retry-all-errors \
            --retry-connrefused \
            --retry-delay 2 \
            --retry-max-time 60 \
            http://127.0.0.1:3001/health/live

      - name: Show ARM64 container logs
        if: always()
        run: docker logs api-arm64-check

      - name: Remove ARM64 test container
        if: always()
        run: docker rm -f api-arm64-check
